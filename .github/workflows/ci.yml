name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    name: test (node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:all

  packaged-app:
    runs-on: windows-latest
    timeout-minutes: 30
    name: packaged Windows application
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: electron
      - name: Fetch bundled ngrok seed binary
        shell: pwsh
        env:
          NGROK_PLATFORMS: win32
        run: pwsh scripts/fetch-ngrok.ps1
      - name: Build unpacked Windows application
        run: npm run electron:build
      - name: Verify packaged application layout
        run: npm run verify:packaged
      - name: Verify packaged OAuth and MCP connector flow
        run: npm run test:connector-acceptance
