name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    name: test (node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:all

  installed-app:
    runs-on: windows-latest
    timeout-minutes: 30
    name: installed Windows application
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: electron
      - name: Fetch bundled ngrok seed binary
        shell: pwsh
        env:
          NGROK_PLATFORMS: win32
        run: pwsh scripts/fetch-ngrok.ps1
      - name: Build, install, and capture usability evidence
        run: npm run test:installed
        env:
          REL_AI_RELEASE_EVIDENCE_DIR: ${{ runner.temp }}\relai-usability-evidence
      - name: Upload installed-app usability evidence
        uses: actions/upload-artifact@v4
        with:
          name: installed-app-usability-evidence
          path: ${{ runner.temp }}\relai-usability-evidence
          if-no-files-found: error
          retention-days: 14
