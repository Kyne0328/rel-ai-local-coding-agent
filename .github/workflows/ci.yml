name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    name: test (node 24)
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: electron
      - run: npm run verify:color-tokens
      - run: npm run audit:production
      - run: npm run test:all

  packaged-app:
    runs-on: windows-latest
    timeout-minutes: 35
    name: packaged Windows application
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci
        working-directory: electron
      - name: Verify ngrok acquisition manifest
        run: npm run verify:ngrok
      - name: Verify generated color assets
        run: npm run verify:color-tokens
      - name: Build unpacked Windows application
        run: npm run electron:build
      - name: Resolve current unpacked application
        id: unpacked
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDirectory = (node scripts/current-unpacked.mjs).Trim()
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $packageDirectory -PathType Container)) {
            throw 'Could not resolve the promoted unpacked application.'
          }
          "path=$packageDirectory" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Verify packaged application layout
        shell: pwsh
        run: npm run verify:packaged -- --dir '${{ steps.unpacked.outputs.path }}'
      - name: Verify hardened Electron fuses
        shell: pwsh
        run: node electron/scripts/verify-fuses.js '${{ steps.unpacked.outputs.path }}/Rel.AI MCP.exe'
      - name: Verify packaged OAuth and MCP connector flow
        shell: pwsh
        run: npm run test:connector-acceptance -- --dir '${{ steps.unpacked.outputs.path }}'
