name: Publish GitHub Release

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - electron/**
      - scripts/**
      - vendor/zoekt/**
      - vendor/tunnel-client/**
      - src/repository/intelligence/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: publish-github-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Resolve unpublished version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.preflight.outputs.publish }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Refuse an existing tag or release
        id: preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Tag $VERSION already exists. Nothing will be republished."
            exit 0
          fi
          api_base="${GITHUB_API_URL:-https://api.github.com}"
          release_url="$api_base/repos/$GITHUB_REPOSITORY/releases/tags/$VERSION"
          http_status="$(curl --silent --show-error --output release-response.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$release_url")"
          case "$http_status" in
            200)
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "GitHub release $VERSION already exists. Nothing will be republished."
              ;;
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              cat release-response.json >&2 || true
              echo "Could not determine whether GitHub release $VERSION exists. GitHub API returned HTTP $http_status." >&2
              exit 1
              ;;
          esac

  windows:
    name: Build Windows release
    needs: preflight
    if: needs.preflight.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json
      - name: Install project dependencies
        run: npm ci --ignore-scripts
      - name: Install Electron dependencies
        run: npm ci
        working-directory: electron
      - name: Install Electron test binary
        run: node electron/node_modules/electron/install.js
      - name: Verify Electron test binary
        shell: pwsh
        run: |
          $electronBinary = 'electron/node_modules/electron/dist/electron.exe'
          if (-not (Test-Path -LiteralPath $electronBinary -PathType Leaf)) {
            throw "Electron test binary is missing after installation: $electronBinary"
          }
      - name: Audit production dependencies
        run: npm run audit:production
      - name: Audit packaging dependencies
        run: npm run audit:packaging
      - name: Fetch OpenAI tunnel-client
        shell: pwsh
        env:
          TUNNEL_CLIENT_PLATFORMS: win32
        run: node scripts/fetch-tunnel-client.mjs
      - name: Build bundled Zoekt binaries
        shell: pwsh
        env:
          ZOEKT_PLATFORMS: win32
        run: pwsh scripts/fetch-zoekt.ps1
      - name: Verify generated color assets
        run: npm run verify:color-tokens
      - name: Run native Tasks release gate
        run: npm run test:native-tasks-release-gate
      - name: Run tests
        run: npm test
      - name: Record observability performance metrics
        run: npm run benchmark:observability
      - name: Verify responsive and accessible dashboard behavior
        run: npm run test:observability-browser
      - name: Reverify generated color assets before packaging
        run: npm run verify:color-tokens
      - name: Build Windows release
        run: npm run electron:dist:windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Resolve current unpacked application
        id: unpacked
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDirectory = [string](node scripts/current-unpacked.mjs --platform win32)
          $packageDirectory = $packageDirectory.Trim()
          if (-not $packageDirectory -or -not (Test-Path -LiteralPath $packageDirectory -PathType Container)) {
            throw 'Resolved current Windows unpacked application path is missing or invalid.'
          }
          "path=$packageDirectory" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Verify hardened Electron fuses
        shell: pwsh
        run: npm run verify:fuses -- --platform win32 '${{ steps.unpacked.outputs.path }}/Rel.AI MCP.exe'
      - name: Verify bundled OpenAI tunnel-client
        shell: pwsh
        env:
          TUNNEL_CLIENT_PLATFORMS: win32
        run: node scripts/verify-tunnel-client.mjs
      - name: Verify packaged application layout
        shell: pwsh
        run: npm run verify:packaged -- --platform win32 --dir '${{ steps.unpacked.outputs.path }}'
      - name: Verify packaged bearer-authenticated MCP flow
        shell: pwsh
        run: npm run test:connector-acceptance -- --dir '${{ steps.unpacked.outputs.path }}'
      - name: Generate CycloneDX SBOM
        run: npm run generate:sbom
      - name: Report Electron package size
        run: npm run electron:size:windows -- --json dist/electron-size-report.json
      - name: Upload Windows release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release-${{ needs.preflight.outputs.version }}
          path: |
            dist/Rel.AI-MCP-Setup-${{ needs.preflight.outputs.version }}.exe
            dist/Rel.AI-MCP-Portable-${{ needs.preflight.outputs.version }}.exe
            dist/Rel.AI-MCP-Setup-${{ needs.preflight.outputs.version }}.exe.blockmap
            dist/latest.yml
            dist/sbom.cdx.json
            dist/electron-size-report.json
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Build Linux release
    needs: preflight
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json
      - name: Install project dependencies
        run: npm ci --ignore-scripts
      - name: Install Electron dependencies
        run: npm ci
        working-directory: electron
      - name: Install Electron test binary
        run: node electron/node_modules/electron/install.js
      - name: Verify Electron test binary
        run: test -x electron/node_modules/electron/dist/electron
      - name: Fetch OpenAI tunnel-client
        env:
          TUNNEL_CLIENT_PLATFORMS: linux
        run: node scripts/fetch-tunnel-client.mjs
      - name: Build bundled Zoekt binaries
        env:
          ZOEKT_PLATFORMS: linux
        run: bash scripts/fetch-zoekt.sh
      - name: Verify generated color assets
        run: npm run verify:color-tokens
      - name: Run Electron platform regression tests
        run: |
          node test/electron-platform-unit.mjs
          node test/current-unpacked-unit.mjs
          node test/app-updater-unit.mjs
          node test/installer-test-entrypoints-unit.mjs
      - name: Build Linux release
        run: npm run electron:dist:linux
      - name: Verify Linux DEB upgrade metadata
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.preflight.outputs.version }}'
          deb="dist/Rel.AI-MCP-${version}-linux-x64.deb"
          test -f "$deb"
          test "$(dpkg-deb --field "$deb" Package)" = 'rel-ai-mcp-launcher'
          test "$(dpkg-deb --field "$deb" Version)" = "$version"
          test "$(dpkg-deb --field "$deb" Architecture)" = 'amd64'
          dpkg --compare-versions "$(dpkg-deb --field "$deb" Version)" eq "$version"
      - name: Resolve current unpacked application
        id: unpacked
        shell: bash
        run: |
          set -euo pipefail
          package_directory="$(node scripts/current-unpacked.mjs --platform linux)"
          test -n "$package_directory"
          test -d "$package_directory"
          echo "path=$package_directory" >> "$GITHUB_OUTPUT"
      - name: Verify hardened Electron fuses
        run: npm run verify:fuses -- --platform linux '${{ steps.unpacked.outputs.path }}/rel-ai-mcp'
      - name: Verify packaged application layout
        run: npm run verify:packaged -- --platform linux --dir '${{ steps.unpacked.outputs.path }}'
      - name: Verify packaged bearer-authenticated MCP flow
        run: npm run test:connector-acceptance -- --dir '${{ steps.unpacked.outputs.path }}'
      - name: Smoke-test Linux desktop startup under Xvfb
        shell: bash
        env:
          PACKAGE_DIRECTORY: ${{ steps.unpacked.outputs.path }}
        run: |
          set -euo pipefail
          state_directory="$RUNNER_TEMP/relai-linux-release-smoke"
          sandbox_helper="$PACKAGE_DIRECTORY/chrome-sandbox"
          mkdir -p "$state_directory"
          sudo chown root:root "$sandbox_helper"
          sudo chmod 4755 "$sandbox_helper"
          test "$(stat -c '%u:%g:%a' "$sandbox_helper")" = '0:0:4755'
          set +e
          REL_AI_MCP_STATE_DIR="$state_directory" timeout --signal=TERM --kill-after=5s 15s \
            xvfb-run --auto-servernum "$PACKAGE_DIRECTORY/rel-ai-mcp" --background
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi
      - name: Report Electron package size
        run: npm run electron:size:linux -- --json dist/electron-size-report-linux.json
      - name: Upload Linux release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-release-${{ needs.preflight.outputs.version }}
          path: |
            dist/Rel.AI-MCP-${{ needs.preflight.outputs.version }}-linux-x64.AppImage
            dist/Rel.AI-MCP-${{ needs.preflight.outputs.version }}-linux-x64.deb
            dist/latest-linux.yml
            dist/electron-size-report-linux.json
          if-no-files-found: error
          retention-days: 7

  mac:
    name: Build macOS release (${{ matrix.arch }})
    needs: preflight
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json
      - name: Install project dependencies
        run: npm ci --ignore-scripts
      - name: Install Electron dependencies
        run: npm ci
        working-directory: electron
      - name: Fetch OpenAI tunnel-client
        env:
          TUNNEL_CLIENT_PLATFORMS: darwin
          REL_AI_TARGET_ARCH: ${{ matrix.arch }}
        run: node scripts/fetch-tunnel-client.mjs
      - name: Build bundled Zoekt binaries
        env:
          ZOEKT_PLATFORMS: darwin
          REL_AI_TARGET_ARCH: ${{ matrix.arch }}
        run: bash scripts/fetch-zoekt.sh
      - name: Verify generated color assets
        run: npm run verify:color-tokens
      - name: Run Electron platform regression tests
        run: |
          node test/electron-platform-unit.mjs
          node test/current-unpacked-unit.mjs
          node test/installer-test-entrypoints-unit.mjs
      - name: Build macOS release
        env:
          REL_AI_TARGET_ARCH: ${{ matrix.arch }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run electron:dist:mac
      - name: Resolve current unpacked application
        id: unpacked
        env:
          REL_AI_TARGET_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          package_directory="$(node scripts/current-unpacked.mjs --platform darwin)"
          test -n "$package_directory"
          test -d "$package_directory"
          echo "path=$package_directory" >> "$GITHUB_OUTPUT"
      - name: Verify hardened Electron fuses
        env:
          REL_AI_TARGET_ARCH: ${{ matrix.arch }}
        run: npm run verify:fuses -- --platform darwin '${{ steps.unpacked.outputs.path }}/Rel.AI MCP.app/Contents/MacOS/Rel.AI MCP'
      - name: Verify packaged application layout
        env:
          REL_AI_TARGET_ARCH: ${{ matrix.arch }}
        run: npm run verify:packaged -- --platform darwin --dir '${{ steps.unpacked.outputs.path }}'
      - name: Verify packaged bearer-authenticated MCP flow
        env:
          REL_AI_TARGET_PLATFORM: darwin
          REL_AI_TARGET_ARCH: ${{ matrix.arch }}
        run: npm run test:connector-acceptance -- --dir '${{ steps.unpacked.outputs.path }}'
      - name: Upload macOS release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-release-${{ needs.preflight.outputs.version }}-${{ matrix.arch }}
          path: dist/Rel.AI-MCP-${{ needs.preflight.outputs.version }}-mac-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish combined release
    needs:
      - preflight
      - windows
      - linux
      - mac
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          cache: npm
      - name: Install release tooling dependencies
        run: npm ci --ignore-scripts
      - name: Download Windows release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-release-${{ needs.preflight.outputs.version }}
          path: dist
      - name: Download Linux release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-release-${{ needs.preflight.outputs.version }}
          path: dist
      - name: Download macOS release bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: macos-release-${{ needs.preflight.outputs.version }}-*
          path: dist
          merge-multiple: true
      - name: Prepare release assets
        run: npm run prepare:release-assets
      - name: Prepare release notes
        id: notes
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version = process.env.VERSION;
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const pattern = new RegExp(`(?:^|\\n)##\\s+\\[${escaped}\\]\\s+(?:—|-)\\s+\\d{4}-\\d{2}-\\d{2}\\s*\\r?\\n([\\s\\S]*?)(?=\\r?\\n##\\s+\\[|$)`);
          const match = changelog.match(pattern);
          if (match?.[1]?.trim()) fs.writeFileSync('release-notes.md', `${match[1].trim()}\n`);
          NODE
          if [ -s release-notes.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Attest release artifact provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/latest.yml
            dist/latest-linux.yml
            dist/SHA256SUMS.txt
            dist/electron-size-report*.json
      - name: Attest release SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3.0.0
        with:
          subject-path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
          sbom-path: dist/sbom.cdx.json
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
          CHANGELOG_NOTES_FOUND: ${{ steps.notes.outputs.found }}
        run: |
          set -euo pipefail
          mapfile -t asset_names < <(sed '/^[[:space:]]*$/d' dist/release-assets.txt)
          if [ "${#asset_names[@]}" -eq 0 ]; then
            echo 'No release assets were prepared.' >&2
            exit 1
          fi
          assets=()
          for name in "${asset_names[@]}"; do
            test -f "dist/$name"
            assets+=("dist/$name")
          done
          arguments=(release create "$VERSION" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Rel.AI MCP $VERSION")
          if [ "$CHANGELOG_NOTES_FOUND" = 'true' ]; then
            arguments+=(--notes-file release-notes.md)
          else
            arguments+=(--generate-notes)
          fi
          gh "${arguments[@]}"
