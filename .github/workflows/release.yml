name: Publish GitHub Release

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: publish-github-release
  cancel-in-progress: false

jobs:
  release:
    name: Test, build, and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json

      - name: Detect package version change
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $currentVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if (-not $currentVersion) {
            throw 'package.json does not contain a version.'
          }

          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            "changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "version=$currentVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Manual release requested for current package version $currentVersion."
            exit 0
          }

          $beforeSha = '${{ github.event.before }}'
          if (-not $beforeSha -or $beforeSha -match '^0+$') {
            throw 'The previous commit could not be determined; refusing to publish a release.'
          }

          $previousPackageJson = git show "$($beforeSha):package.json"
          if ($LASTEXITCODE -ne 0 -or -not $previousPackageJson) {
            throw "Could not read package.json from previous commit $beforeSha."
          }

          $previousVersion = ($previousPackageJson | ConvertFrom-Json).version
          if ($previousVersion -eq $currentVersion) {
            $changedFiles = @(git diff --name-only $beforeSha $env:GITHUB_SHA)
            if ($LASTEXITCODE -ne 0) {
              throw "Could not inspect files changed since $beforeSha."
            }
            if ($changedFiles -notcontains '.github/workflows/release.yml') {
              "changed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              Write-Host "package.json changed, but its version remains $currentVersion. No release will be published."
              exit 0
            }
            Write-Host "Release workflow changed while package version remains $currentVersion. Retrying the unpublished version."
          }

          "changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$currentVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Version changed from $previousVersion to $currentVersion."

      - name: Refuse an existing tag or release
        if: steps.version.outputs.changed == 'true'
        id: preflight
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'

          $existingTag = git ls-remote --tags origin "refs/tags/$env:VERSION"
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not check the remote tags.'
          }
          if ($existingTag) {
            "publish=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Tag $env:VERSION already exists. Nothing will be republished."
            exit 0
          }

          $apiBase = if ($env:GITHUB_API_URL) { $env:GITHUB_API_URL.TrimEnd('/') } else { 'https://api.github.com' }
          $encodedVersion = [Uri]::EscapeDataString($env:VERSION)
          $releaseUri = "$apiBase/repos/$env:GITHUB_REPOSITORY/releases/tags/$encodedVersion"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $response = Invoke-WebRequest -Uri $releaseUri -Headers $headers -Method Get -SkipHttpErrorCheck
          $releaseStatus = [int]$response.StatusCode

          if ($releaseStatus -eq 200) {
            "publish=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "GitHub release $env:VERSION already exists. Nothing will be republished."
            exit 0
          }
          if ($releaseStatus -ne 404) {
            throw "Could not check whether GitHub release $env:VERSION already exists. GitHub API returned HTTP $releaseStatus."
          }
          "publish=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "No existing tag or GitHub release was found for $env:VERSION."

      - name: Install project dependencies
        if: steps.version.outputs.changed == 'true' && steps.preflight.outputs.publish == 'true'
        run: npm ci --ignore-scripts

      - name: Install Electron dependencies
        if: steps.version.outputs.changed == 'true' && steps.preflight.outputs.publish == 'true'
        run: npm ci
        working-directory: electron

      - name: Audit production dependencies
        if: steps.version.outputs.changed == 'true' && steps.preflight.outputs.publish == 'true'
        run: npm run audit:production

      - name: Audit packaging dependencies
        if: steps.version.outputs.changed == 'true' && steps.preflight.outputs.publish == 'true'
        run: npm run audit:packaging

      - name: Verify official ngrok acquisition end to end
        if: steps.version.outputs.changed == 'true' && steps.preflight.outputs.publish == 'true'
        run: npm run verify:ngrok -- --download

      - name: Verify generated color assets
        if: steps.version.outputs.changed == 'true' && steps.preflight.outputs.publish == 'true'
        run: npm run verify:color-tokens

      - name: Run tests
        if: steps.version.outputs.changed == 'true' && steps.preflight.outputs.publish == 'true'
        run: npm test

      - name: Enforce observability performance budgets
        if: steps.version.outputs.changed == 'true' && steps.preflight.outputs.publish == 'true'
        run: npm run benchmark:observability

      - name: Verify responsive and accessible dashboard behavior
        if: steps.version.outputs.changed == 'true' && steps.preflight.outputs.publish == 'true'
        run: npm run test:observability-browser

      - name: Reverify generated color assets before packaging
        if: steps.version.outputs.changed == 'true' && steps.preflight.outputs.publish == 'true'
        run: npm run verify:color-tokens

      - name: Require Windows signing credentials
        if: steps.version.outputs.changed == 'true' && steps.preflight.outputs.publish == 'true'
        shell: pwsh
        env:
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CSC_LINK)) {
            throw 'WINDOWS_CSC_LINK is required for release publication.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CSC_KEY_PASSWORD)) {
            throw 'WINDOWS_CSC_KEY_PASSWORD is required for release publication.'
          }
      - name: Build Windows executables
        if: steps.version.outputs.changed == 'true' && steps.preflight.outputs.publish == 'true'
        run: npm run electron:dist -- --config.forceCodeSigning=true
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

      - name: Resolve current unpacked application
        if: steps.version.outputs.changed == 'true' && steps.preflight.outputs.publish == 'true'
        id: unpacked
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDirectory = (node scripts/current-unpacked.mjs).Trim()
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $packageDirectory -PathType Container)) {
            throw 'Could not resolve the current unpacked application.'
          }
          "path=$packageDirectory" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify hardened Electron fuses
        if: steps.version.outputs.changed == 'true' && steps.preflight.outputs.publish == 'true'
        run: npm run verify:fuses

      - name: Verify Windows signatures and ngrok acquisition boundary
        if: steps.version.outputs.changed == 'true' && steps.preflight.outputs.publish == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-Item -LiteralPath "dist/Rel.AI-MCP-Setup-$env:VERSION.exe"
          $portable = Get-Item -LiteralPath "dist/Rel.AI-MCP-Portable-$env:VERSION.exe"
          $releaseExecutables = @($installer, $portable)
          $packageDirectory = '${{ steps.unpacked.outputs.path }}'
          $appExecutable = Get-Item (Join-Path $packageDirectory 'Rel.AI MCP.exe')
          foreach ($executable in @($releaseExecutables) + @($appExecutable)) {
            $signature = Get-AuthenticodeSignature -LiteralPath $executable.FullName
            if ($signature.Status -ne 'Valid') {
              throw "$($executable.Name) does not have a valid Authenticode signature: $($signature.Status)."
            }
          }

          $packagedNgrok = Join-Path $packageDirectory 'resources/bin/ngrok/win32/ngrok.exe'
          if (Test-Path -LiteralPath $packagedNgrok) {
            throw 'The release package embeds ngrok.exe; first-run acquisition requires a manifest-only package.'
          }
          $packagedManifest = Join-Path $packageDirectory 'resources/bin/ngrok/manifest.json'
          if (-not (Test-Path -LiteralPath $packagedManifest -PathType Leaf)) {
            throw 'The packaged ngrok acquisition manifest is missing.'
          }

      - name: Generate CycloneDX SBOM
        if: steps.version.outputs.changed == 'true' && steps.preflight.outputs.publish == 'true'
        run: npm run generate:sbom

      - name: Report Electron package size
        if: steps.version.outputs.changed == 'true' && steps.preflight.outputs.publish == 'true'
        run: npm run electron:size -- --json dist/electron-size-report.json

      - name: Upload Electron package-size report
        if: steps.version.outputs.changed == 'true' && steps.preflight.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: electron-package-size-${{ steps.version.outputs.version }}
          path: dist/electron-size-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify packaged application layout
        if: steps.version.outputs.changed == 'true' && steps.preflight.outputs.publish == 'true'
        shell: pwsh
        run: npm run verify:packaged -- --dir '${{ steps.unpacked.outputs.path }}'

      - name: Verify packaged OAuth and MCP connector flow
        if: steps.version.outputs.changed == 'true' && steps.preflight.outputs.publish == 'true'
        shell: pwsh
        run: npm run test:connector-acceptance -- --dir '${{ steps.unpacked.outputs.path }}'

      - name: Prepare release assets and notes
        if: steps.version.outputs.changed == 'true' && steps.preflight.outputs.publish == 'true'
        id: notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'

          $dist = (Resolve-Path dist).Path
          $assetNames = @(
            "Rel.AI-MCP-Setup-$env:VERSION.exe",
            "Rel.AI-MCP-Portable-$env:VERSION.exe",
            "Rel.AI-MCP-Setup-$env:VERSION.exe.blockmap",
            'latest.yml',
            'sbom.cdx.json',
            'electron-size-report.json'
          )
          $hashInputs = foreach ($assetName in $assetNames) {
            $assetPath = Join-Path $dist $assetName
            if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
              throw "Required release asset is missing under its exact basename: $assetName"
            }
            Get-Item -LiteralPath $assetPath
          }
          npm run prepare:release-assets
          if ($LASTEXITCODE -ne 0) {
            throw 'Release assets could not be prepared under the exact updater contract.'
          }

          $changelog = Get-Content CHANGELOG.md -Raw
          $escapedVersion = [regex]::Escape($env:VERSION)
          $pattern = "(?ms)^##\s+\[$escapedVersion\]\s+(?:—|-)\s+\d{4}-\d{2}-\d{2}\s*\r?\n(.*?)(?=^##\s+\[|\z)"
          $match = [regex]::Match($changelog, $pattern)

          if ($match.Success -and $match.Groups[1].Value.Trim()) {
            $match.Groups[1].Value.Trim() | Set-Content -Path release-notes.md -Encoding utf8
            "found=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Using CHANGELOG.md notes for $env:VERSION."
          } else {
            "found=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "No matching changelog section found. GitHub will generate the release notes."
          }

      - name: Attest release artifact provenance
        if: steps.version.outputs.changed == 'true' && steps.preflight.outputs.publish == 'true'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt

      - name: Attest release SBOM
        if: steps.version.outputs.changed == 'true' && steps.preflight.outputs.publish == 'true'
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3.0.0
        with:
          subject-path: dist/*.exe
          sbom-path: dist/sbom.cdx.json

      - name: Publish GitHub release
        if: steps.version.outputs.changed == 'true' && steps.preflight.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          CHANGELOG_NOTES_FOUND: ${{ steps.notes.outputs.found }}
        run: |
          $ErrorActionPreference = 'Stop'

          $dist = (Resolve-Path dist).Path
          $assetNames = @(Get-Content -LiteralPath (Join-Path $dist 'release-assets.txt') | Where-Object { $_.Trim() })
          $assets = @($assetNames | ForEach-Object {
            $assetPath = Join-Path $dist $_
            if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
              throw "Prepared release asset is missing: $_"
            }
            $assetPath
          })
          if ($assets.Count -eq 0) {
            throw 'No release assets were prepared.'
          }

          $arguments = @(
            'release', 'create', $env:VERSION
          ) + $assets + @(
            '--repo', $env:GITHUB_REPOSITORY,
            '--target', $env:GITHUB_SHA,
            '--title', "Rel.AI MCP $env:VERSION"
          )

          if ($env:CHANGELOG_NOTES_FOUND -eq 'true') {
            $arguments += @('--notes-file', 'release-notes.md')
          } else {
            $arguments += '--generate-notes'
          }

          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish GitHub release $env:VERSION."
          }
