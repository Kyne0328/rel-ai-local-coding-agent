<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rel.AI MCP</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    background: #0d1117;
    color: #e0e0e0;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .header { background: #161622; padding: 11px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2a2a3e; flex-shrink: 0; }
  .header-left { display: flex; align-items: center; gap: 8px; }
  .header-title { font-weight: 600; font-size: 14px; }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .version { font-size: 11px; color: #555; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; flex-shrink: 0; }
  .status-dot.running { background: #22c55e; }
  .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .card { background: #111; border-radius: 6px; padding: 10px 12px; }
  .card-label { font-size: 11px; color: #777; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; }
  .card-status { font-size: 14px; font-weight: 600; }
  .card-sub { font-size: 11px; color: #555; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .running-text { color: #22c55e; }
  .connecting-text { color: #fbbf24; }
  .failed-text { color: #f87171; }
  .stopped-text { color: #666; }
  .copy-box { background: #0d1f0d; border: 1px solid #166534; border-radius: 6px; padding: 12px 14px; }
  .copy-label { font-size: 11px; color: #777; margin-bottom: 6px; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 500; }
  .copy-url { font-size: 12px; color: #60a5fa; word-break: break-all; margin-bottom: 10px; font-family: "SF Mono", Consolas, monospace; min-height: 32px; line-height: 1.5; }
  .copy-url.empty { color: #555; font-style: italic; }
  .error-line { color: #f87171; font-size: 12px; min-height: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { cursor: pointer; font-family: inherit; }
  .btn-copy { width: 100%; background: #3b82f6; border: none; border-radius: 5px; color: #fff; padding: 8px; font-size: 13px; font-weight: 500; }
  .btn-copy:hover { background: #2563eb; }
  .btn-copy:disabled { background: #1e2e4a; color: #555; cursor: not-allowed; }
  .actions { display: flex; gap: 6px; margin-top: 4px; }
  .btn-action { flex: 1; background: #1e1e2e; border: 1px solid #333; border-radius: 5px; color: #aaa; padding: 8px; font-size: 12px; }
  .btn-action:hover { background: #2a2a3e; }
  .btn-stop { background: #7f1d1d; border: none; color: #fca5a5; }
  .btn-stop:hover { background: #991b1b; }
  .btn-start { background: #14532d; border: none; color: #86efac; font-weight: 600; }
  .btn-start:hover { background: #166534; }
  .ext-box { background: #111; border-radius: 6px; padding: 10px 12px; }
  .ext-label { font-size: 11px; color: #777; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; }
  .ext-path { font-size: 11px; color: #94a3b8; font-family: "SF Mono", Consolas, monospace; word-break: break-all; margin-bottom: 7px; min-height: 16px; line-height: 1.4; }
  .ext-hint { font-size: 11px; color: #555; margin-bottom: 8px; line-height: 1.5; }
  .btn-ext { width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 5px; color: #94a3b8; padding: 7px; font-size: 12px; }
  .btn-ext:hover { background: #273448; }
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <span>Rel.AI</span>
    <span class="header-title">MCP Launcher</span>
  </div>
  <div class="header-right">
    <span class="version" id="appVersion">v0.12.0</span>
    <div class="status-dot" id="headerDot"></div>
  </div>
</div>

<div class="body">
  <div class="cards">
    <div class="card">
      <div class="card-label">MCP Server</div>
      <div class="card-status stopped-text" id="serverStatus">Stopped</div>
      <div class="card-sub" id="serverSub">127.0.0.1</div>
    </div>
    <div class="card">
      <div class="card-label">ngrok tunnel</div>
      <div class="card-status stopped-text" id="tunnelStatus">Offline</div>
      <div class="card-sub" id="tunnelSub">static domain</div>
    </div>
  </div>

  <div class="copy-box">
    <div class="copy-label">Copy this for ChatGPT</div>
    <div class="copy-url empty" id="mcpUrl">Waiting for tunnel...</div>
    <button class="btn-copy" id="copyBtn" disabled>Copy MCP URL</button>
  </div>

  <div class="error-line" id="errorLine"></div>

  <div class="ext-box">
    <div class="ext-label">Chrome Extension</div>
    <div class="ext-path" id="extPath">Loading...</div>
    <div class="ext-hint">1. Open <strong>chrome://extensions</strong> in Chrome<br>2. Toggle <strong>Developer mode</strong> (top-right)<br>3. Click <strong>Load unpacked</strong> &rarr; select the path above</div>
    <button class="btn-ext" id="extCopyBtn">Copy Extension Path</button>
  </div>

  <div class="actions">
    <button class="btn-action" id="dashboardBtn">Dashboard</button>
    <button class="btn-action" id="settingsBtn">Settings</button>
    <button class="btn-action btn-stop" id="stopBtn">Stop</button>
    <button class="btn-action btn-start" id="startBtn" style="display:none">Start</button>
  </div>
</div>

<script src="status.js"></script>
</body>
</html>
