<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Rel.AI status</title>
<style>
:root{color-scheme:light dark;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--relai-surface:rgba(127,127,127,.06);--relai-border:rgba(127,127,127,.2);--relai-muted:rgba(127,127,127,.92);--relai-good:#198754;--relai-bad:#c93434;--relai-warn:#9a6500;--relai-safe-top:0px;--relai-safe-right:0px;--relai-safe-bottom:0px;--relai-safe-left:0px}
*{box-sizing:border-box}
body{margin:0;padding:calc(.375rem + var(--relai-safe-top)) calc(.25rem + var(--relai-safe-right)) calc(.375rem + var(--relai-safe-bottom)) calc(.25rem + var(--relai-safe-left));background:transparent;color:var(--color-text-primary,CanvasText);font-size:.8125rem;line-height:1.35}
body.lifecycle-hidden{height:1px;min-height:1px;padding:0;overflow:hidden}.lifecycle-hidden .status-strip,.lifecycle-hidden noscript{display:none}
.status-strip{display:flex;align-items:center;gap:.625rem;min-width:0;max-width:100%;padding:.5rem .625rem;border:1px solid var(--color-border-default,var(--relai-border));border-radius:.75rem;background:var(--color-background-secondary,var(--relai-surface))}
.copy{min-width:0;flex:1 1 auto}
h1{margin:0;font-size:.8125rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{margin-top:.125rem;color:var(--color-text-secondary,var(--relai-muted));font-size:.6875rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:0 0 auto;border:1px solid var(--color-border-default,var(--relai-border));border-radius:999rem;padding:.1875rem .5rem;font-size:.6875rem;white-space:nowrap;background:var(--color-background-primary,transparent)}
.pill.good{color:var(--color-text-success,var(--relai-good))}.pill.bad{color:var(--color-text-danger,var(--relai-bad))}.pill.warn{color:var(--color-text-warning,var(--relai-warn))}
@media(max-width:28rem){.status-strip{align-items:flex-start;flex-wrap:wrap}.copy{flex-basis:calc(100% - 4rem)}.meta{white-space:normal}}
</style>
</head>
<body class="lifecycle-hidden">
<noscript>Rel.AI task status remains available in the ChatGPT conversation.</noscript>
<main class="status-strip" id="status-strip" aria-label="Rel.AI task status" aria-live="polite">
  <div class="copy">
    <h1 id="title">Repository task</h1>
    <div class="meta" id="meta">Waiting for task status…</div>
  </div>
  <span class="pill" id="status-pill">Ready</span>
</main>
<script>
(function(){
  'use strict';
  const pending=new Map();
  const listeners=new AbortController();
  let nextId=1,latestInput=null,latestOutput=null,cardVisible=false,liveTimer=null;
  const el={title:document.getElementById('title'),meta:document.getElementById('meta'),pill:document.getElementById('status-pill')};
  function text(value){if(value===null||value===undefined)return '';if(typeof value==='string'||typeof value==='number'||typeof value==='boolean')return String(value);return ''}
  function safeArray(value){return Array.isArray(value)?value:[]}
  function payloadOf(result){return result&&typeof result==='object'&&result.structuredContent?result.structuredContent:result}
  function inputOf(value){const input=value&&typeof value==='object'?value:{};return input.arguments&&typeof input.arguments==='object'?input.arguments:input}
  function acceptInput(value){latestInput=inputOf(value);configureLifecycle(text(latestInput.action));if(cardVisible&&!latestOutput)render({...latestInput,status:'running',message:'Starting repository task…'},false)}
  function configureLifecycle(action){cardVisible=action==='begin';document.body.classList.toggle('lifecycle-hidden',!cardVisible);if(!cardVisible)stopLiveStatus();reportHeight()}
  function request(method,params){const id=nextId++;window.parent.postMessage({jsonrpc:'2.0',id:id,method:method,params:params},'*');return new Promise(function(resolve,reject){pending.set(id,{resolve:resolve,reject:reject})})}
  function callTool(name,args){if(window.openai&&typeof window.openai.callTool==='function')return window.openai.callTool(name,args);return request('tools/call',{name:name,arguments:args})}
  function statusOf(data){const validation=text(data.validationStatus||data.task&&data.task.validation).toLowerCase();const status=text(data.status||data.task&&data.task.status||data.workflow&&data.workflow.stage).toLowerCase();if(data.ok===false||validation==='failed'||status==='failed')return {label:'Failed',tone:'bad'};if(data.completionKnown===true||status==='completed')return {label:'Complete',tone:'good'};if(status==='cancelled')return {label:'Cancelled',tone:'warn'};if(validation==='passed')return {label:'Validated',tone:'good'};if(status==='running'||status==='working')return {label:'Running',tone:''};return {label:status?status.charAt(0).toUpperCase()+status.slice(1):'Ready',tone:''}}
  function titleOf(data){const task=data.task&&typeof data.task==='object'?data.task:{};return text(data.title||task.goal||data.objective)||'Repository task'}
  function changedCount(data){const values=new Set();[data.changedFiles,data.sessionChangedFiles,data.reviewedFiles,data.residualChangedFiles,data.task&&data.task.changes].forEach(function(list){safeArray(list).forEach(function(item){const value=text(item&&typeof item==='object'?(item.path||item.name):item);if(value)values.add(value)})});return values.size}
  function metadataOf(data){const parts=[];const workspace=typeof data.workspace==='object'?text(data.workspace.alias):text(data.workspace);const stage=text(data.workflow&&data.workflow.stage);const validation=text(data.validationStatus||data.task&&data.task.validation);const changed=changedCount(data);if(workspace)parts.push(workspace);if(stage)parts.push(stage);if(validation)parts.push(validation);if(changed)parts.push(changed+' changed');return parts.join(' · ')||text(data.message||data.summary)||'Repository task'}
  function render(data,authoritative){data=data&&typeof data==='object'?data:{};if(authoritative!==false)latestOutput=data;if(!cardVisible){reportHeight();return}el.title.textContent=titleOf(data);el.meta.textContent=metadataOf(data);const state=statusOf(data);el.pill.textContent=state.label;el.pill.className='pill'+(state.tone?' '+state.tone:'');if(authoritative!==false)scheduleLiveStatus(data);reportHeight()}
  function terminalTask(data){const status=text(data&&data.status||data&&data.task&&data.task.status).toLowerCase();return data&&data.completionKnown===true||['completed','cancelled','failed'].includes(status)}
  function stopLiveStatus(){if(liveTimer!==null){clearTimeout(liveTimer);liveTimer=null}}
  function scheduleLiveStatus(data){stopLiveStatus();if(!cardVisible||document.hidden||!currentWorkId()||terminalTask(data))return;liveTimer=setTimeout(function(){void refreshLiveStatus()},3000)}
  async function refreshLiveStatus(){liveTimer=null;if(!cardVisible||document.hidden)return;const workId=currentWorkId();if(!workId)return;try{const raw=await callTool('relai_app_task',{work_id:workId});const result=payloadOf(raw)||{};if(result.ok&&result.data)render(result.data)}catch{}finally{if(liveTimer===null)scheduleLiveStatus(latestOutput)}}
  function currentWorkId(){return text(latestOutput&&latestOutput.work_id||latestInput&&latestInput.work_id)}
  function reportHeight(){const height=cardVisible?Math.max(1,Math.ceil(document.documentElement.scrollHeight)):1;try{window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/size-changed',params:{height:height}},'*')}catch{}if(!window.openai||typeof window.openai.notifyIntrinsicHeight!=='function')return;try{window.openai.notifyIntrinsicHeight({height:height})}catch{try{window.openai.notifyIntrinsicHeight(height)}catch{}}}
  function cssLength(value){const number=Number(value);return Number.isFinite(number)&&number>=0?String(number)+'px':'0px'}
  function applyHostContext(globals){globals=globals&&typeof globals==='object'?globals:{};const api=window.openai||{};const incomingInput=globals.toolInput!==undefined?globals.toolInput:api.toolInput;if(incomingInput)acceptInput(incomingInput);const incomingOutput=globals.toolOutput!==undefined?globals.toolOutput:api.toolOutput;if(incomingOutput&&typeof incomingOutput==='object')render(incomingOutput);const locale=text(globals.locale||api.locale);if(locale)document.documentElement.lang=locale;const theme=text(globals.theme||api.theme);if(theme)document.documentElement.dataset.theme=theme;const safe=globals.safeArea||api.safeArea||{};const insets=safe.insets&&typeof safe.insets==='object'?safe.insets:safe;document.documentElement.style.setProperty('--relai-safe-top',cssLength(insets.top));document.documentElement.style.setProperty('--relai-safe-right',cssLength(insets.right));document.documentElement.style.setProperty('--relai-safe-bottom',cssLength(insets.bottom));document.documentElement.style.setProperty('--relai-safe-left',cssLength(insets.left));const hostContext=globals.hostContext||api.hostContext||{};const variables=hostContext.styles&&hostContext.styles.variables||globals.styles&&globals.styles.variables||{};if(variables&&typeof variables==='object'){Object.entries(variables).forEach(function(entry){const name=entry[0],value=entry[1];if(name.startsWith('--')&&(typeof value==='string'||typeof value==='number'))document.documentElement.style.setProperty(name,String(value))})}reportHeight()}
  window.addEventListener('openai:set_globals',function(event){applyHostContext(event&&event.detail&&event.detail.globals)},{passive:true,signal:listeners.signal});
  window.addEventListener('message',function(event){if(event.source!==window.parent)return;const message=event.data;if(!message||message.jsonrpc!=='2.0')return;if(message.id!==undefined&&pending.has(message.id)){const entry=pending.get(message.id);pending.delete(message.id);if(message.error)entry.reject(message.error);else entry.resolve(message.result);return}if(message.method==='ui/notifications/tool-input')acceptInput(message.params);if(message.method==='ui/notifications/tool-result'){const result=message.params||{};if(result.structuredContent&&typeof result.structuredContent==='object')render(result.structuredContent)}if(message.method==='ui/notifications/host-context-changed')applyHostContext(message.params&&message.params.hostContext||message.params)},{passive:true,signal:listeners.signal});
  document.addEventListener('visibilitychange',function(){stopLiveStatus();if(!document.hidden&&cardVisible)void refreshLiveStatus()},{passive:true,signal:listeners.signal});
  window.addEventListener('pagehide',function(){listeners.abort();stopLiveStatus();pending.clear()},{once:true});
  if(typeof ResizeObserver==='function'){const observer=new ResizeObserver(reportHeight);observer.observe(document.documentElement);window.addEventListener('pagehide',function(){observer.disconnect()},{once:true})}
  applyHostContext({});
})();
</script>
</body>
</html>
