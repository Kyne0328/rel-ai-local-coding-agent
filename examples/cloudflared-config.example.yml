# Example Cloudflare Tunnel config for a stable Rel.AI MCP connector URL.
# Replace the tunnel id, credentials path, and hostname with your own values.
# Save as ~/.cloudflared/config.yml on macOS/Linux or the equivalent cloudflared config path on Windows.

tunnel: rel-ai-mcp
credentials-file: /Users/you/.cloudflared/<tunnel-id>.json

ingress:
  - hostname: relai.your-domain.com
    service: http://127.0.0.1:3333
  - service: http_status:404
